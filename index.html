<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>CQ777 - Gaming & Lottery Platform</title> <script src="https://cdn.tailwindcss.com"></script> </head> <body class="bg-slate-950 text-white min-h-screen"> <!-- App Container --> <div id="app" class="max-w-md mx-auto p-4"> <!-- Login Screen --> <div id="loginScreen" class="min-h-screen flex flex-col items-center justify-center"> <div class="w-full bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl"> <div class="text-center mb-8"> <h1 class="text-4xl font-black text-amber-400 tracking-wider">CQ777</h1> <p class="text-slate-400 text-sm mt-1">bKash & Nagad Gaming Platform</p> </div> <div class="space-y-4"> <div> <label class="text-xs text-slate-400">Phone Number</label> <input type="text" id="phoneInput" placeholder="01XXXXXXXXX" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-amber-400" /> </div> <div> <label class="text-xs text-slate-400">Password</label> <input type="password" id="passInput" placeholder="••••••••" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-amber-400" /> </div> <button onclick="handleLogin()" class="w-full bg-amber-500 hover:bg-amber-600 font-bold py-3 rounded-lg text-slate-950 transition"> Login to CQ777 </button> </div> <div class="mt-8 pt-6 border-t border-slate-800 text-center"> <p class="text-xs text-slate-400 mb-2">Admin Portal Access (admin / cq777admin2026)</p> <div class="flex gap-2"> <input type="text" id="adminUserInput" placeholder="Admin User" class="w-1/2 bg-slate-800 border border-slate-700 rounded-lg p-2 text-xs text-white" /> <input type="password" id="adminPassInput" placeholder="Admin Password" class="w-1/2 bg-slate-800 border border-slate-700 rounded-lg p-2 text-xs text-white" /> <button onclick="handleAdminLogin()" class="bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded-lg text-xs font-bold">Admin</button> </div> </div> </div> </div> <!-- Dashboard Screen (Hidden initially) --> <div id="dashboardScreen" class="hidden pb-10"> <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl flex justify-between items-center mb-4"> <div> <h1 class="text-xl font-black text-amber-400">CQ777</h1> <p id="userPhoneDisplay" class="text-xs text-slate-400"></p> </div> <div class="text-right"> <p id="balanceLabel" class="text-xs text-slate-400">Real Balance</p> <p class="text-lg font-bold text-emerald-400">৳ <span id="balanceDisplay">500.00</span> BDT</p> </div> </div> <!-- Demo / Real Switcher --> <div class="flex bg-slate-900 p-1 rounded-xl mb-6 border border-slate-800"> <button onclick="switchMode('real')" id="realBtn" class="flex-1 py-2 text-xs font-bold rounded-lg bg-amber-500 text-slate-950">Real Account</button> <button onclick="switchMode('demo')" id="demoBtn" class="flex-1 py-2 text-xs font-bold rounded-lg text-slate-400">Demo Account (Free)</button> </div> <!-- Deposit Section --> <div id="depositCard" class="bg-slate-900 border border-slate-800 p-5 rounded-xl mb-6"> <h2 class="text-lg font-semibold mb-3 text-pink-400">bKash & Nagad Deposit</h2> <div class="space-y-3"> <div class="flex gap-2"> <button onclick="setMethod('bKash')" id="bkashBtn" class="flex-1 py-2 rounded-lg font-bold text-sm bg-pink-600 text-white">bKash</button> <button onclick="setMethod('Nagad')" id="nagadBtn" class="flex-1 py-2 rounded-lg font-bold text-sm bg-slate-800 text-slate-400">Nagad</button> </div> <p class="text-xs text-slate-400">Send money to merchant: <b class="text-white">01700000000</b> (<span id="methodDisplay">bKash</span>)</p> <input type="number" id="depAmount" placeholder="Amount (BDT)" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-white" /> <input type="text" id="depSender" placeholder="Sender Number (01XXXXXXXXX)" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-white" /> <input type="text" id="depTrx" placeholder="Transaction ID (TrxID)" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-white" /> <button onclick="submitDeposit()" class="w-full bg-emerald-600 hover:bg-emerald-500 font-bold py-2 rounded-lg text-sm transition"> Submit Deposit </button> </div> </div> <!-- Game Lobby --> <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl"> <h2 class="text-lg font-semibold mb-3 text-amber-400">CQ777 Game Lobby</h2> <div class="grid grid-cols-2 gap-3"> <div onclick="openGame('aviator')" class="bg-slate-800 p-4 rounded-lg border border-slate-700 text-center cursor-pointer hover:border-amber-400 transition"> <span class="text-2xl">✈️</span> <p class="font-bold text-sm mt-1 text-red-400">Aviator</p> </div> <div onclick="openGame('wingo')" class="bg-slate-800 p-4 rounded-lg border border-slate-700 text-center cursor-pointer hover:border-amber-400 transition"> <span class="text-2xl">🎲</span> <p class="font-bold text-sm mt-1 text-emerald-400">Win Go</p> </div> <div onclick="alert('Color Prediction Game Active!')" class="bg-slate-800 p-4 rounded-lg border border-slate-700 text-center cursor-pointer hover:border-amber-400 transition"> <span class="text-2xl">🎨</span> <p class="font-bold text-sm mt-1">Color Prediction</p> </div> <div onclick="alert('Lucky Spin Game Active!')" class="bg-slate-800 p-4 rounded-lg border border-slate-700 text-center cursor-pointer hover:border-amber-400 transition"> <span class="text-2xl">🎡</span> <p class="font-bold text-sm mt-1">Lucky Spin</p> </div> </div> </div> <button onclick="logout()" class="w-full mt-6 bg-slate-800 text-slate-400 py-2 rounded-lg text-xs">Logout</button> </div> <!-- Game Modal / View --> <div id="gameScreen" class="hidden min-h-screen py-6"> <button onclick="closeGame()" class="text-xs bg-slate-800 px-3 py-1 rounded mb-4">← Back to Lobby</button> <div id="gameContent"></div> </div> </div> <script> let isDemo = false; let realBal = 500.0; let demoBal = 10000.0; let currentMethod = 'bKash'; let aviatorInterval = null; function handleLogin() { let phone = document.getElementById('phoneInput').value; let pass = document.getElementById('passInput').value; if(!phone || !pass) { alert("Please enter phone and password"); return; } document.getElementById('userPhoneDisplay').innerText = phone; document.getElementById('loginScreen').classList.add('hidden'); document.getElementById('dashboardScreen').classList.remove('hidden'); } function handleAdminLogin() { let u = document.getElementById('adminUserInput').value; let p = document.getElementById('adminPassInput').value; if(u === "admin" && p === "cq777admin2026") { alert("Admin Login Successful! (Redirecting to Dashboard)"); document.getElementById('loginScreen').classList.add('hidden'); document.getElementById('dashboardScreen').classList.remove('hidden'); } else { alert("Invalid Admin Credentials. Default: admin / cq777admin2026"); } } function logout() { document.getElementById('dashboardScreen').classList.add('hidden'); document.getElementById('loginScreen').classList.remove('hidden'); } function switchMode(mode) { isDemo = (mode === 'demo'); if(isDemo) { document.getElementById('realBtn').className = "flex-1 py-2 text-xs font-bold rounded-lg text-slate-400"; document.getElementById('demoBtn').className = "flex-1 py-2 text-xs font-bold rounded-lg bg-emerald-500 text-slate-950"; document.getElementById('balanceLabel').innerText = "Demo Balance"; document.getElementById('balanceDisplay').innerText = demoBal.toFixed(2); document.getElementById('depositCard').classList.add('hidden'); } else { document.getElementById('demoBtn').className = "flex-1 py-2 text-xs font-bold rounded-lg text-slate-400"; document.getElementById('realBtn').className = "flex-1 py-2 text-xs font-bold rounded-lg bg-amber-500 text-slate-950"; document.getElementById('balanceLabel').innerText = "Real Balance"; document.getElementById('balanceDisplay').innerText = realBal.toFixed(2); document.getElementById('depositCard').classList.remove('hidden'); } } function setMethod(m) { currentMethod = m; document.getElementById('methodDisplay').innerText = m; if(m === 'bKash') { document.getElementById('bkashBtn').className = "flex-1 py-2 rounded-lg font-bold text-sm bg-pink-600 text-white"; document.getElementById('nagadBtn').className = "flex-1 py-2 rounded-lg font-bold text-sm bg-slate-800 text-slate-400"; } else { document.getElementById('nagadBtn').className = "flex-1 py-2 rounded-lg font-bold text-sm bg-orange-600 text-white"; document.getElementById('bkashBtn').className = "flex-1 py-2 rounded-lg font-bold text-sm bg-slate-800 text-slate-400"; } } function submitDeposit() { let amt = document.getElementById('depAmount').value; let sender = document.getElementById('depSender').value; let trx = document.getElementById('depTrx').value; if(!amt || !sender || !trx) { alert("Please fill all deposit fields"); return; } alert(`Deposit of ${amt} BDT via ${currentMethod} submitted successfully!`); document.getElementById('depAmount').value = ''; document.getElementById('depSender').value = ''; document.getElementById('depTrx').value = ''; } function openGame(game) { document.getElementById('dashboardScreen').classList.add('hidden'); document.getElementById('gameScreen').classList.remove('hidden'); let content = document.getElementById('gameContent'); if(game === 'aviator') { content.innerHTML = ` <h1 class="text-2xl font-bold text-red-500 mb-4">✈️ Aviator Crash Game</h1> <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl text-center mb-4"> <div id="multiplierBox" class="text-5xl font-black text-amber-400 mb-6">1.00x</div> <button onclick="startAviator()" id="flyBtn" class="w-full bg-red-600 hover:bg-red-500 font-bold py-3 rounded-lg text-white">Place Bet & Fly</button> </div> `; } else if(game === 'wingo') { content.innerHTML = ` <h1 class="text-2xl font-bold text-emerald-400 mb-4">🎲 Win Go (1 Min)</h1> <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl text-center"> <p class="text-sm text-slate-400 mb-4">Select Your Lucky Color</p> <div class="grid grid-cols-3 gap-2"> <button onclick="alert('Bet Placed on GREEN!')" class="bg-emerald-600 py-3 rounded-lg font-bold">Green</button> <button onclick="alert('Bet Placed on VIOLET!')" class="bg-purple-600 py-3 rounded-lg font-bold">Violet</button> <button onclick="alert('Bet Placed on RED!')" class="bg-rose-600 py-3 rounded-lg font-bold">Red</button> </div> </div> `; } } function closeGame() { if(aviatorInterval) clearInterval(aviatorInterval); document.getElementById('gameScreen').classList.add('hidden'); document.getElementById('dashboardScreen').classList.remove('hidden'); } function startAviator() { let mult = 1.00; let box = document.getElementById('multiplierBox'); let btn = document.getElementById('flyBtn'); btn.disabled = true; btn.innerText = "Flying..."; aviatorInterval = setInterval(() => { mult += 0.08; box.innerText = mult.toFixed(2) + "x"; if(mult > 4.5 && Math.random() > 0.8) { clearInterval(aviatorInterval); box.innerText = "CRASHED (" + mult.toFixed(2) + "x)"; btn.disabled = false; btn.innerText = "Place Bet & Fly"; } }, 200); } </script> </body> </html>
